services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudpulse}
      POSTGRES_USER: ${POSTGRES_USER:-cloudpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudpulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cloudpulse} -d $${POSTGRES_DB:-cloudpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - cloudpulse_net
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudpulse}:${POSTGRES_PASSWORD:-cloudpulse}@db:5432/${POSTGRES_DB:-cloudpulse}
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudpulse_net
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudpulse}:${POSTGRES_PASSWORD:-cloudpulse}@db:5432/${POSTGRES_DB:-cloudpulse}
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cloudpulse_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - cloudpulse_net
    restart: unless-stopped

volumes:
  postgres_data:
    name: cloudpulse_postgres_data

networks:
  cloudpulse_net:
    driver: bridge
