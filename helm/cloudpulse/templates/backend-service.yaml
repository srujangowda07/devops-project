apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudpulse.fullname" . }}-backend
  labels:
    {{- include "cloudpulse.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "cloudpulse.backend.selectorLabels" . | nindent 4 }}
