{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudpulse.secretName" . }}
  labels:
    {{- include "cloudpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_URL: {{ include "cloudpulse.databaseUrl" . | quote }}
{{- end }}
