apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudpulse.fullname" . }}-backend
  labels:
    {{- include "cloudpulse.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudpulse.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudpulse.backend.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          env:
            - name: APP_ENV
              value: {{ .Values.backend.env.appEnv | default "production" | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudpulse.secretName" . }}
                  key: DATABASE_URL
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
