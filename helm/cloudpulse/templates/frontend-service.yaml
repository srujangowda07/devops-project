apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudpulse.fullname" . }}-frontend
  labels:
    {{- include "cloudpulse.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "cloudpulse.frontend.selectorLabels" . | nindent 4 }}
