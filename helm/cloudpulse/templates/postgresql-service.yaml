{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudpulse.fullname" . }}-postgresql
  labels:
    {{- include "cloudpulse.postgresql.labels" . | nindent 4 }}
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
      protocol: TCP
  selector:
    {{- include "cloudpulse.postgresql.selectorLabels" . | nindent 4 }}
{{- end }}
