# Prometheus Scrape Configuration for CloudPulse
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cloudpulse-backend'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['cloudpulse-backend:8000']
        labels:
          app: 'cloudpulse'
          environment: 'production'
          component: 'backend'
