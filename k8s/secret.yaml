apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-secret
  namespace: cloudpulse
  labels:
    app.kubernetes.io/name: cloudpulse
    app.kubernetes.io/instance: cloudpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "cloudpulse_secure_password"
  DATABASE_URL: "postgresql+psycopg://cloudpulse:cloudpulse_secure_password@cloudpulse-postgresql:5432/cloudpulse"
